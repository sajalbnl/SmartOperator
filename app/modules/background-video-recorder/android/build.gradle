plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smartoperatorrecorder'
version = '0.1.0'

android {
  namespace 'expo.modules.smartoperatorrecorder'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  lintOptions {
    abortOnError false
  }
}

// CameraX 1.6 needs the real ListenableFuture jar. React Native otherwise
// resolves Guava's intentionally empty conflict-avoidance artifact.
configurations.configureEach {
  resolutionStrategy.force 'com.google.guava:listenablefuture:1.0'
}

dependencies {
  def cameraxVersion = '1.6.0'
  implementation "androidx.camera:camera-camera2:${cameraxVersion}"
  implementation "androidx.camera:camera-core:${cameraxVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
  implementation "androidx.camera:camera-video:${cameraxVersion}"
  implementation "androidx.camera:camera-view:${cameraxVersion}"
  implementation 'com.google.guava:listenablefuture:1.0'
}
